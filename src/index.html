<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The 1984 Amiga Boing Ball demo, rebuilt for the web: exact, reversible physics for up to 4000 spinning balls, the original sounds, copper bars, a scroller, a twister, vector bobs, a tunnel, and HDR.">
  <!-- The Amiga font is fetched at once, rather than only when the page's
       style asks for it, so the text appears sooner. -->
  <!-- (Two copies of the loading picture: one marked as Display P3, for wide-colour screens, so its colours are as deep as the demo's own.) -->
  <link rel="preload" href="static/loading-p3.webp" as="image" fetchpriority="high" media="(color-gamut: p3)">
  <link rel="preload" href="static/loading.webp" as="image" fetchpriority="high" media="not all and (color-gamut: p3)">
  <link rel="preload" href="static/amiga.woff2" as="font" type="font/woff2" crossorigin>
  <!-- What a link to the page shows when shared (social media, chats): a
       picture, the title and the description. The addresses must be full
       ones, so they name where the page lives; change them if it moves. The
       page's own address is coffeevortex.net (which leads here); the
       picture's is the GitHub Pages one, where the file itself is. The
       picture is a screenshot of the Four balls preset, 1200 × 630. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://coffeevortex.net/">
  <meta property="og:title" content="Amiga Boing Balls">
  <meta property="og:description" content="The 1984 Amiga Boing Ball demo, rebuilt for the web: exact, reversible physics for up to 4000 spinning balls, the original sounds, copper bars, a scroller, a twister, vector bobs, a tunnel, and HDR.">
  <meta property="og:image" content="https://johnmattsson.github.io/AmigaBoingBalls/static/preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Four checkered Boing Balls, red, green, blue and yellow, bouncing in a purple grid box on a grey background, as in the 1984 Amiga demo">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The tab icon, drawn for each size (see build/make-favicons.py), and
       the icon for a phone's home screen. -->
  <link rel="icon" type="image/png" sizes="16x16" href="static/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="static/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="static/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="static/favicon.png">
  <link rel="apple-touch-icon" href="static/apple-touch-icon.png">
  <title>Amiga Boing Balls</title>
  <!-- How the page looks (see style.css; the build puts it into the published page). -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="app-bar panel-title"><button class="window-close raised" title="Close (in full screen: back to the window)" aria-label="Close"></button><span class="app-title">Amiga Boing Balls</span></div>

  <div id="rewind"></div>
  <div id="info">Amiga Boing Balls Release 2.04 by <a href="mailto:john [dot] mattsson@gmail.com">John Preuß Mattsson</a></div>

  <!-- The loading screen, shown while the scripts load and for at least a
       moment (main.js takes it away; see MIN_LOADING_MS there). -->
  <div id="loading" role="status" aria-label="Loading Amiga Boing Balls 2.04">
    <picture>
      <source srcset="static/loading-p3.webp" media="(color-gamut: p3)">
      <img src="static/loading.webp" alt="" width="1536" height="1024" fetchpriority="high">
    </picture>
    <div id="loading-text">Loading Amiga Boing Balls 2.04...</div>
  </div>

  <!-- Load the scripts.

       Browsers keep copies of files they have downloaded (a "cache"). After
       you publish a new version, some visitors could get a mix of old and new
       scripts for a while. Adding "?v=<version>" to every script address
       makes them look like new files, so everyone gets the new set at once.
       So: CHANGE VERSION WHENEVER YOU PUBLISH CHANGES. (Only the build
       number after the dash: the release shown on the page stays 2.04.)

       The "import map" makes the scripts' imports of each other (such as
       import './physics.js') use the same versioned addresses.

       Note: scripts that import each other ("modules") don't load from
       file://, so open the page through a web server (see README). -->
  <script>
    const VERSION = '2.04-397';
    const scripts = ['main', 'physics', 'precise', 'rewindcheck', 'renderer', 'shaders', 'camera', 'math', 'audio', 'gui', 'twist', 'effect-options', 'effects', 'music', 'scroller', 'presets', 'settings', 'state', 'shade', 'page', 'app', 'info', 'room', 'hdr', 'scene', 'drawing', 'about', 'graphs', 'measure', 'show', 'gpu-renderer', 'precise-wasm', 'physics-client', 'physics-host', 'countdown', 'colors', 'tile-clicks', 'shell-pieces'];

    const imports = {};
    for (const name of scripts) imports[`./js/${name}.js`] = `./js/${name}.js?v=${VERSION}`;
    const importMap = document.createElement('script');
    importMap.type = 'importmap';
    importMap.textContent = JSON.stringify({ imports });
    document.currentScript.after(importMap);

    // Tell the browser about all the scripts at once ("modulepreload"), so it
    // fetches them side by side, instead of finding them one by one as each
    // script imports the next (main.js → physics.js → precise.js → ...).
    let last = importMap;
    for (const name of scripts) {
      const link = document.createElement('link');
      link.rel = 'modulepreload';
      link.href = imports[`./js/${name}.js`];
      last.after(link);
      last = link;
    }

    const main = document.createElement('script');
    main.type = 'module';
    main.src = `js/main.js?v=${VERSION}`;
    last.after(main);

    // Should the demo fail to start, say so where the credit line is, instead
    // of leaving a grey page. (Once it runs, window.boing exists and its own
    // messages take over.)
    const tell = (text) => {
      if (window.boing) return;
      const info = document.getElementById('info');
      info.dataset.credit ??= info.innerHTML;   // (put back by main.js once it runs)
      info.style.display = '';
      info.textContent = text;
      const loading = document.getElementById('loading-text');
      if (loading) loading.textContent = text;
    };
    main.onerror = () => tell('Sorry, the demo\'s scripts could not be loaded. Please reload the page.');
    addEventListener('error', (e) => tell(`Sorry, the demo could not start: ${e.message}`));
    addEventListener('unhandledrejection', (e) => tell(`Sorry, the demo could not start: ${e.reason?.message ?? e.reason}`));
    setTimeout(() => tell('Still starting… (if nothing happens, please reload the page)'), 10000);
  </script>
</body>
</html>
