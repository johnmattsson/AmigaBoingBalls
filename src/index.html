<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The 1984 Amiga Boing Ball demo, rebuilt for the web: exact, reversible physics for up to 1000 spinning balls, the original sounds, copper bars, a scroller, a twister, and HDR.">
  <!-- The Amiga font is fetched at once, rather than only when the page's
       style asks for it, so the text appears sooner. -->
  <link rel="preload" href="static/amiga.woff2" as="font" type="font/woff2" crossorigin>
  <!-- The tab icon, drawn for each size (see static/make-favicons.py), and
       the icon for a phone's home screen. -->
  <link rel="icon" type="image/png" sizes="16x16" href="static/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="static/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="static/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="static/favicon.png">
  <link rel="apple-touch-icon" href="static/apple-touch-icon.png">
  <title>Amiga Boing Balls</title>
  <style>
    /* The Amiga's own Topaz-style font, and the classic mouse pointer. */
    @font-face { font-family: Amiga; src: url(static/amiga.woff2) format("woff2"); }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667);
      font: 10px Amiga, monospace;
      color: #000000; color: color(display-p3 0 0 0);   /* Workbench 2.0 drew its text in black */
      cursor: url(static/cursor.png), auto;   /* the classic Amiga pointer */
    }
    * { cursor: inherit; }

    /* The 3D scene fills the whole page. touch-action: none stops the
       browser from scrolling or zooming the page when you drag on it. */
    #scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }

    /* Over it, the page is drawn as a Workbench 2.0 window: a blue title
       bar across the top, with the speed and preset gadgets on it, the
       title in the space left over, and the zoom gadget at its right end;
       and a thin grey frame around the rest. Both fade away together with
       the controls (body.idle, see "Fading the controls" in main.js),
       leaving just the scene. In full screen there is no window: only the
       controls, in grey boxes, floating over the scene (and fading the same way). */
    .app-bar.panel-title { position: absolute; top: 0; left: 0; right: 0; height: 25px; line-height: 25px; z-index: 3;
                           padding: 0; border-top: 1px solid #ffffff; border-top: 1px solid color(display-p3 1 1 1); user-select: none; }
    .app-title { position: absolute; top: 0; left: 40px; white-space: nowrap; }
    /* The close gadget, at the far left as on the Amiga. (It can't close a
       web page: it puts the window away at once, see main.js.) */
    .app-bar .window-close { position: absolute; top: -1px; left: 0; width: 28px; height: 27px; }
    .app-bar .window-close::after { left: calc(50% - 4px); top: calc(50% - 4px); }
    .app-bar .zoom-gadget { position: absolute; top: -1px; right: 0; width: 28px; height: 27px; padding: 0;
                            background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667); border-width: 1px 2px; }
    .app-frame { position: absolute; inset: 27px 0 0 0; z-index: 2; pointer-events: none;
                 border: solid #aaaaaa; border: solid color(display-p3 0.6667 0.6667 0.6667); border-width: 0 4px 4px; box-shadow: inset 0 0 0 1px #000000; box-shadow: inset 0 0 0 1px color(display-p3 0 0 0); }
    .app-bar, .app-frame { transition: opacity 0.6s; }
    body.idle .app-bar, body.idle .app-frame { opacity: 0; pointer-events: none; }
    body.fullscreen .app-bar, body.fullscreen .app-frame { display: none; }   /* (full screen: no window) */
    /* In full screen (with a mouse and room enough) the controls sit on a
       plain grey bar along the top edge: the title bar of the window, grey
       instead of blue, with only the close gadget (which leaves full screen).
       Speed and presets on the left, Open Controls on the right, nothing in the
       middle (where the browser shows its full-screen notice). The bar
       fades away with the controls. */
    @media (min-width: 641px) and (pointer: fine) {
      body.fullscreen .app-bar { display: block; background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667); }
      body.fullscreen .app-bar > * { display: none; }   /* (no title or zoom gadget) */
      body.fullscreen .app-bar > .window-close { display: block; }   /* (the close gadget leaves full screen) */
      body.fullscreen .speed-bar { top: 0; left: 36px; background: transparent; border-color: transparent; }
      body.fullscreen .preset-bar { top: 34px; left: 8px; }   /* (below the bar when narrow) */
      body.fullscreen #rewind { top: 72px; left: 8px; }
      body.fullscreen .panel { top: 4px; right: 8px; }
    }
    @media (min-width: 960px) and (pointer: fine) {
      body.fullscreen .preset-bar { top: 0; left: 360px; background: transparent; border-color: transparent; }
      body.fullscreen #rewind { top: 38px; }
    }
    body:not(.fullscreen) .panel { right: 34px; top: 4px; }   /* (on the title bar, left of the zoom gadget) */
    /* On the title bar, the speed and preset gadgets sit directly on the
       blue, as gadgets in a Workbench title bar do. (Only in the window: the
       "body:not(.fullscreen)" in front of these rules also makes them win
       over the bars' own rules further down.) */
    /* Which gadgets fit on the bar depends on the width. With a mouse and
       room enough, the speed gadgets go after the title; from 1145 pixels
       the preset gadgets fit too (narrower, they are on a second row, in a
       grey box over the scene). On touch screens, where they are drawn
       bigger, and on narrow screens, both rows go below the bar. */
    /* The free space on the bar is shared out between the gaps: one and a
       half shares after the title, one share between the other groups. The
       title ends at 196 px; Open Controls (245 px) starts 279 px from the
       right; each group of gadgets is 300 px wide. Between 641 and 829 px
       there is no room for the speed gadgets either: they go below the bar. */
    @media (min-width: 641px) and (max-width: 829px) and (pointer: fine) {
      body:not(.fullscreen) .speed-bar { top: 28px; }
      body:not(.fullscreen) .preset-bar { top: 55px; }
      body:not(.fullscreen) #rewind { top: 116px; }
    }
    @media (min-width: 830px) and (pointer: fine) {
      /* free: 100vw − 279 − 196 − 300 = 100vw − 775, in 2.5 shares */
      body:not(.fullscreen) .speed-bar { left: calc(196px + (100vw - 775px) * 0.6); width: 284px;
                                          background: transparent; border-color: transparent; }
      body:not(.fullscreen) .preset-bar { top: 27px; left: 15px; }
      body:not(.fullscreen) #rewind { top: 89px; }
    }
    @media (min-width: 1145px) and (pointer: fine) {
      /* free: 100vw − 279 − 196 − 600 = 100vw − 1075, in 3.5 shares */
      body:not(.fullscreen) .speed-bar { left: calc(196px + (100vw - 1075px) * 1.5 / 3.5); }
      body:not(.fullscreen) .preset-bar { top: 0; left: calc(496px + (100vw - 1075px) * 2.5 / 3.5); width: 284px;
                                           background: transparent; border-color: transparent; }
      body:not(.fullscreen) #rewind { top: 62px; }
    }
    @media (pointer: coarse) and (min-width: 641px) {
      body:not(.fullscreen) .speed-bar { top: 28px; }
      body:not(.fullscreen) .preset-bar { top: 72px; }
      body:not(.fullscreen) #rewind { top: 168px; }
    }
    @media (max-width: 640px) {
      body:not(.fullscreen) .speed-bar { top: 28px; }
      body:not(.fullscreen) .preset-bar { top: 55px; }
      body:not(.fullscreen) #rewind { top: 116px; }
    }

    #info { position: absolute; z-index: 1; bottom: 12px; width: 100%; text-align: center; line-height: 1.6;
            pointer-events: none; }
    #info a { color: inherit; pointer-events: auto; }
    /* Over the dark copper-bar backdrop, black text would be unreadable. */
    body.copper #info { color: #ffffff; color: color(display-p3 1 1 1); }

    /* "<< REWIND", blinking in the top-left corner like on a video recorder,
       while time runs backwards (main.js sets the class on <body>). */
    #rewind { position: absolute; z-index: 1; top: 89px; left: 16px; font-size: 200%; color: #c40233; color: color(display-p3 0.7686 0.0078 0.2);
              text-shadow: 2px 2px 0 #000000; text-shadow: 2px 2px 0 color(display-p3 0 0 0); pointer-events: none; display: none; }
    body.rewinding #rewind { display: block; animation: rewind-blink 1s steps(1) infinite; }
    @keyframes rewind-blink { 0% { opacity: 1; } 70% { opacity: 0; } }
    body.copper #rewind { color: #ffffff; color: color(display-p3 1 1 1); }

    /* ---- Settings panel, styled as an AmigaOS 2.0 Workbench window ----
       Workbench 2.0 used four colours: grey #aaaaaa, black, white and light
       blue #6688bb. Buttons look raised (white edges top/left, black edges
       bottom/right); colours: grey color(display-p3 0.6667 0.6667 0.6667), black, white and light
       blue color(display-p3 0.4 0.5333 0.7333). Buttons look raised (white edges top/left, black edges
       bottom/right); sliders and number boxes look sunken (the reverse).
       Amiga pixels were twice as tall as wide, so side edges are 2px. */
    .raised { border: solid; border-width: 1px 2px; border-color: #ffffff #000000 #000000 #ffffff; border-color: color(display-p3 1 1 1) color(display-p3 0 0 0) color(display-p3 0 0 0) color(display-p3 1 1 1); }
    .sunken { border: solid; border-width: 1px 2px; border-color: #000000 #ffffff #ffffff #000000; border-color: color(display-p3 0 0 0) color(display-p3 1 1 1) color(display-p3 1 1 1) color(display-p3 0 0 0); }

    .panel { position: absolute; top: 0; right: 15px; width: 245px; color: #000000; color: color(display-p3 0 0 0); user-select: none; z-index: 5; }
    .panel-window { background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667); }
    .panel.closed .panel-window { display: none; }
    .panel-title { height: 16px; line-height: 16px; padding: 0 6px; background: #6688bb; background: color(display-p3 0.4 0.5333 0.7333);
                   border-bottom: 1px solid #000000; border-bottom: 1px solid color(display-p3 0 0 0); }
    /* With many rows the panel can be taller than a small window: then the
       rows scroll, and the title and Close button stay in place. */
    .panel-rows { padding: 4px 0; max-height: calc(100vh - 60px); overflow-y: auto; scrollbar-width: thin; }
    .panel-row { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px; }
    .panel-row.panel-graph { height: 66px; }   /* the graph on the Info page */
    .panel-row.panel-hidden { display: none !important; }   /* rows under a switch that is off */
    .panel-row.panel-sub .panel-label { text-indent: 10px; }   /* ...and indented under it */
    .panel-graph canvas { flex: 1; height: 60px; min-width: 0; background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667); }
    .panel-label { width: 46%; white-space: nowrap; }
    /* The rewind test's readout on the Info page: yellow when a rewind would
       drift, red when it is no longer possible. */
    .readout.drifting { background: #ffd300; background: color(display-p3 1 0.8275 0); }
    .readout.lost { background: #c40233; background: color(display-p3 0.7686 0.0078 0.2); color: #ffffff; color: color(display-p3 1 1 1); }

    /* Slider: a sunken track with a raised knob that slides along it. */
    .slider { flex: 1; height: 15px; position: relative; touch-action: none; }
    .slider-knob { position: absolute; top: 0; bottom: 0; width: 22%; background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667); }
    .slider-fill { height: 100%; background: #6688bb; background: color(display-p3 0.4 0.5333 0.7333); }   /* read-only gauge (FPS) */
    .slider-number { width: 40px; height: 15px; line-height: 15px; padding: 0 3px; text-align: right; }
    .readout { flex: 1; height: 15px; line-height: 15px; padding: 0 3px; text-align: right; }

    /* Buttons: raised, and pressed in while held down. */
    .panel button { display: block; width: 100%; height: 18px; padding: 0; background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667);
                    color: #000000; color: color(display-p3 0 0 0); font: inherit; }
    .panel button:active { border-color: #000000 #ffffff #ffffff #000000; border-color: color(display-p3 0 0 0) color(display-p3 1 1 1) color(display-p3 1 1 1) color(display-p3 0 0 0); }
    .panel-close { padding: 4px 6px 6px; }

    /* Tabs: a row of buttons; the chosen page's button stays pressed in. */
    .panel-tabs { gap: 2px; }
    .panel-tabs button.chosen { border-color: #000000 #ffffff #ffffff #000000; border-color: color(display-p3 0 0 0) color(display-p3 1 1 1) color(display-p3 1 1 1) color(display-p3 0 0 0); background: #6688bb; background: color(display-p3 0.4 0.5333 0.7333); }

    /* Cycle gadget: a button with a "next" mark on the left, set off by a
       groove, and the current choice in the middle. */
    .panel button.cycle { flex: 1; width: auto; height: 17px; display: flex; align-items: center; }
    .panel button.cycle { min-width: 0; }   /* (may shrink below its text, which is then cut off) */
    .cycle-mark { width: 16px; line-height: 13px; font: bold 12px sans-serif; text-align: center;
                  border-right: 1px solid #000000; border-right: 1px solid color(display-p3 0 0 0); box-shadow: 1px 0 0 #ffffff; box-shadow: 1px 0 0 color(display-p3 1 1 1); }
    .cycle-text { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; }

    /* Window: can be dragged by its title bar; close gadget top-left. */
    .window { position: absolute; background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667); color: #000000; color: color(display-p3 0 0 0); user-select: none; }
    .window-bar { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 0; touch-action: none; }
    .window-close { width: 18px; height: 16px; padding: 0; background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667); position: relative; }
    .window-close::after { content: ""; position: absolute; left: 5px; top: 5px; width: 4px; height: 4px;
                           background: #ffffff; background: color(display-p3 1 1 1); border: 1px solid #000000; border: 1px solid color(display-p3 0 0 0); }
    .window-close:active { border-color: #000000 #ffffff #ffffff #000000; border-color: color(display-p3 0 0 0) color(display-p3 1 1 1) color(display-p3 1 1 1) color(display-p3 0 0 0); }
    .twist-frame { position: relative; margin: 4px 4px 14px; line-height: 0; }
    .twist-canvas { display: block; }
    /* Zoom gadgets, as on the Amiga: a small box drawn inside a bigger one.
       At the right end of the Twist window's title bar (fill the page), and
       at the end of the speed bar (full screen). */
    .window-zoom { margin-left: auto; width: 18px; height: 16px; padding: 0; background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667); }
    .zoom-gadget { position: relative; flex: none; }
    .zoom-gadget::before { content: ""; position: absolute; left: calc(50% - 5px); top: calc(50% - 4px);
                           width: 8px; height: 6px; border: 1px solid #000000; border: 1px solid color(display-p3 0 0 0); }
    .zoom-gadget::after { content: ""; position: absolute; left: calc(50% - 5px); top: calc(50% - 4px);
                          width: 4px; height: 3px; border: 1px solid #000000; border: 1px solid color(display-p3 0 0 0); background: #ffffff; background: color(display-p3 1 1 1); }
    .zoom-gadget:active { border-color: #000000 #ffffff #ffffff #000000; border-color: color(display-p3 0 0 0) color(display-p3 1 1 1) color(display-p3 1 1 1) color(display-p3 0 0 0); }
    .twist-frame:fullscreen { margin: 0; background: #000; background: color(display-p3 0 0 0); }   /* full screen: just the twist, no borders */
    /* Sizing gadget: bottom-right corner, with the Amiga's little two-box mark. */
    .window-size { position: absolute; right: 0; bottom: 0; width: 14px; height: 12px; touch-action: none;
                   border: solid; border-width: 1px 2px; border-color: #ffffff #000000 #000000 #ffffff; border-color: color(display-p3 1 1 1) color(display-p3 0 0 0) color(display-p3 0 0 0) color(display-p3 1 1 1);
                   background: linear-gradient(135deg, #aaaaaa 50%, #000000 50%, #000000 58%, #ffffff 58%); background: linear-gradient(135deg, color(display-p3 0.6667 0.6667 0.6667) 50%, color(display-p3 0 0 0) 50%, color(display-p3 0 0 0) 58%, color(display-p3 1 1 1) 58%); }

    /* Requester: the content of a window with text and an OK button. */
    .requester { width: min(560px, 100vw - 24px); display: flex; flex-direction: column; }
    .requester-body { margin: 6px; padding: 2px 8px; max-height: calc(100vh - 90px); overflow-y: auto;
                      line-height: 1.5; user-select: text;
                      border: solid; border-width: 1px 2px; border-color: #000000 #ffffff #ffffff #000000; border-color: color(display-p3 0 0 0) color(display-p3 1 1 1) color(display-p3 1 1 1) color(display-p3 0 0 0); }
    .requester-body p { margin: 6px 0; }
    .requester-body.in-parts { height: min(400px, calc(100vh - 120px)); }
    .requester-tabs { display: flex; gap: 2px; margin: 6px 6px 0; }
    .requester .requester-tabs button { flex: 1; width: auto; }
    .requester .requester-tabs button.chosen { border-color: #000000 #ffffff #ffffff #000000; border-color: color(display-p3 0 0 0) color(display-p3 1 1 1) color(display-p3 1 1 1) color(display-p3 0 0 0); background: #6688bb; background: color(display-p3 0.4 0.5333 0.7333); }
    .requester-heading { color: #ffffff; color: color(display-p3 1 1 1); }
    .requester-buttons { padding: 0 6px 6px; display: flex; justify-content: center; }
    .requester button { width: 80px; height: 18px; padding: 0; background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667); color: #000000; color: color(display-p3 0 0 0); font: inherit; }
    .requester button:active { border-color: #000000 #ffffff #ffffff #000000; border-color: color(display-p3 0 0 0) color(display-p3 1 1 1) color(display-p3 1 1 1) color(display-p3 0 0 0); }

    /* Checkbox: a raised box that shows a tick when on. */
    .panel .checkbox { width: 26px; height: 15px; line-height: 13px; text-align: center;
                       font: bold 12px sans-serif; }   /* the Amiga font has no tick */

    /* On touch screens (phones, tablets) fingers need bigger targets, so the
       panel is drawn larger, growing from the top-right corner: 1.8 times on
       tablets, and as large as fits on a narrow phone screen (the panel is
       245 px wide, so 1.4 times fits a 360 px phone). */
    @media (pointer: coarse) {
      .panel { transform: scale(1.8); transform-origin: top right; }
      .panel-rows { max-height: calc((100vh - 110px) / 1.8); }
    }
    @media (pointer: coarse) and (max-width: 480px) {
      .panel { transform: scale(1.4); right: 8px; }
      .panel-rows { max-height: calc((100vh - 85px) / 1.4); }
    }

    /* The speed bar: the speed of time, always shown in the top-left corner,
       in the same Workbench style as the panel. On a narrow screen it sits
       below the Open Controls button instead, across the whole width. */
    .speed-bar { position: absolute; top: 0; left: 15px; width: 300px; z-index: 4; display: flex;
                 align-items: center; gap: 4px; height: 24px; padding: 0 6px; background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667);
                 color: #000000; color: color(display-p3 0 0 0); user-select: none; }
    .speed-bar button { width: 30px; height: 18px; padding: 0; background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667); color: #000000; color: color(display-p3 0 0 0); font: inherit; }
    .speed-bar button:active { border-color: #000000 #ffffff #ffffff #000000; border-color: color(display-p3 0 0 0) color(display-p3 1 1 1) color(display-p3 1 1 1) color(display-p3 0 0 0); }
    .speed-label { padding: 0 2px 0 4px; }
    /* The preset bar, just below the speed bar, in the same style. */
    .preset-bar { position: absolute; top: 27px; left: 15px; width: 300px; z-index: 4; display: flex;
                  align-items: center; gap: 4px; height: 24px; padding: 0 6px; background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667);
                  color: #000000; color: color(display-p3 0 0 0); user-select: none; }
    .preset-bar button { width: 30px; height: 18px; padding: 0; background: #aaaaaa; background: color(display-p3 0.6667 0.6667 0.6667); color: #000000; color: color(display-p3 0 0 0); font: inherit; }
    .preset-bar button:active { border-color: #000000 #ffffff #ffffff #000000; border-color: color(display-p3 0 0 0) color(display-p3 1 1 1) color(display-p3 1 1 1) color(display-p3 0 0 0); }
    .preset-bar button.preset-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
    .preset-bar button.preset-restart { width: auto; padding: 0 6px; }
    /* The rewind check (see rewindcheck.js), just below the speed bar while
       time runs backwards: yellow when drifting, red when the paths are lost. */
    @media (max-width: 640px) {
      .speed-bar { top: 26px; left: 8px; right: 8px; width: auto; }
      .preset-bar { top: 53px; left: 8px; right: 8px; width: auto; }
      #rewind { top: 114px; }
    }
    /* With room enough (and a mouse), both bars on one row, so they cover
       less of the box. */
    @media (min-width: 960px) and (pointer: fine) {
      .preset-bar { top: 0; left: 333px; }
      #rewind { top: 62px; }
    }
    /* When the mouse, keys and screen have been left alone for a few
       seconds, the bars and the Open Controls button fade away (see
       "Fading the controls" in main.js), and come back with any movement.
       The rewind warning and << REWIND stay: they are messages, not controls. */
    .speed-bar, .preset-bar, .panel.closed { transition: opacity 0.6s; }
    body.idle .speed-bar, body.idle .preset-bar, body.idle .panel.closed { opacity: 0; pointer-events: none; }
    body.idle { cursor: none; }   /* the mouse pointer goes too */
    @media (pointer: coarse) and (min-width: 641px) {
      .speed-bar, .preset-bar { transform: scale(1.8); transform-origin: top left; }
      .preset-bar { top: 48px; }
      #rewind { top: 150px; }
    }

    /* The sine scroller: a strip across the bottom, above the credit line.
       Clicks pass straight through it to the scene. */
    .scroller { position: absolute; left: 0; bottom: 30px; width: 100%; height: 130px; pointer-events: none; }
    /* (scroller.js makes it less tall on narrow screens.) */
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="app-bar panel-title"><button class="window-close raised" title="Put the window away (move the mouse to bring it back); in full screen: back to the window" aria-label="Close"></button><span class="app-title">Amiga Boing Balls</span></div>
  <div class="app-frame"></div>

  <div id="rewind">&lt;&lt; REWIND</div>
  <div id="info">Amiga Boing Balls Release 2.04 by <a href="mailto:john [dot] mattsson@gmail.com">John Preuß Mattsson</a></div>

  <!-- Load the scripts.

       Browsers keep copies of files they have downloaded (a "cache"). After
       you publish a new version, some visitors could get a mix of old and new
       scripts for a while. Adding "?v=<version>" to every script address
       makes them look like new files, so everyone gets the new set at once.
       So: CHANGE VERSION WHENEVER YOU PUBLISH CHANGES. (Only the build
       number after the dash: the release shown on the page stays 2.04.)

       The "import map" makes the scripts' imports of each other (such as
       import './physics.js') use the same versioned addresses.

       Note: scripts that import each other ("modules") don't load from
       file://, so open the page through a web server (see README). -->
  <script>
    const VERSION = '2.04-107';
    const scripts = ['main', 'physics', 'precise', 'rewindcheck', 'renderer', 'shaders', 'camera', 'math', 'audio', 'gui', 'twist', 'music', 'scroller', 'presets', 'hdr', 'precise-wasm', 'physics-client', 'physics-host'];

    const imports = {};
    for (const name of scripts) imports[`./js/${name}.js`] = `./js/${name}.js?v=${VERSION}`;
    const importMap = document.createElement('script');
    importMap.type = 'importmap';
    importMap.textContent = JSON.stringify({ imports });
    document.currentScript.after(importMap);

    // Tell the browser about all the scripts at once ("modulepreload"), so it
    // fetches them side by side, instead of finding them one by one as each
    // script imports the next (main.js → physics.js → precise.js → ...).
    let last = importMap;
    for (const name of scripts) {
      const link = document.createElement('link');
      link.rel = 'modulepreload';
      link.href = imports[`./js/${name}.js`];
      last.after(link);
      last = link;
    }

    const main = document.createElement('script');
    main.type = 'module';
    main.src = `js/main.js?v=${VERSION}`;
    last.after(main);

    // Should the demo fail to start, say so where the credit line is, instead
    // of leaving a grey page. (Once it runs, window.boing exists and its own
    // messages take over.)
    const tell = (text) => {
      if (window.boing) return;
      const info = document.getElementById('info');
      info.style.display = '';
      info.textContent = text;
    };
    main.onerror = () => tell('Sorry, the demo\'s scripts could not be loaded. Please reload the page.');
    addEventListener('error', (e) => tell(`Sorry, the demo could not start: ${e.message}`));
    addEventListener('unhandledrejection', (e) => tell(`Sorry, the demo could not start: ${e.reason?.message ?? e.reason}`));
    setTimeout(() => tell('Still starting… (if nothing happens, please reload the page)'), 10000);
  </script>
</body>
</html>
